name: NEVERA Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Run large backtest
        timeout-minutes: 3
        run: node scripts/backtest.js > backtest-result.json
      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: nevera-backtest
          path: backtest-result.json

      - name: Run adversarial stress test
        timeout-minutes: 3
        run: node scripts/stress-test.js > stress-test-result.json
      - name: Print stress test summary
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r = JSON.parse(fs.readFileSync("stress-test-result.json", "utf8"));
          console.log("=== NEVERA STRESS TEST SUMMARY ===");
          console.log(JSON.stringify({
            runsPerScenario: r.runsPerScenario,
            cycles: r.cycles,
            totalCycles: r.totalCycles,
            initialBalance: r.initialBalance,
            overallSurvivalRate: r.overallSurvivalRate,
            passed: r.passed,
            scenarios: r.scenarios
          }, null, 2));
          NODE
      - name: Upload stress test result
        uses: actions/upload-artifact@v4
        with:
          name: nevera-stress-test
          path: stress-test-result.json
