name: NEVERA Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backtest 10,000 cycles
        timeout-minutes: 15
        env:
          NEVERA_BACKTEST_RUNS: 10
          NEVERA_BACKTEST_CYCLES: 10000
          NEVERA_BACKTEST_BALANCE: 10
          NEVERA_BACKTEST_SEED: 20260928
        run: node scripts/backtest.js > backtest-result.json
      - name: Verify backtest result
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r = JSON.parse(fs.readFileSync("backtest-result.json", "utf8"));
          if (r.runs !== 10 || r.cycles !== 10000 || !Number.isFinite(r.averageFinalBalance)) {
            throw new Error("BACKTEST_10000_INVALID");
          }
          console.log("=== NEVERA BACKTEST 10,000 CYCLES ===");
          console.log(JSON.stringify({
            runs: r.runs,
            cycles: r.cycles,
            totalCycles: r.runs * r.cycles,
            survivalRate: r.survivalRate,
            averageFinalBalance: r.averageFinalBalance,
            averageNetReturn: r.averageNetReturn
          }, null, 2));
          NODE
      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: nevera-backtest-10000
          path: backtest-result.json

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run adversarial stress test
        timeout-minutes: 5
        run: node scripts/stress-test.js > stress-test-result.json
      - name: Verify stress test
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r = JSON.parse(fs.readFileSync("stress-test-result.json", "utf8"));
          if (r.passed !== true) throw new Error("STRESS_TEST_FAILED");
          console.log(JSON.stringify({
            totalCycles: r.totalCycles,
            overallSurvivalRate: r.overallSurvivalRate,
            passed: r.passed
          }, null, 2));
          NODE
      - name: Upload stress test result
        uses: actions/upload-artifact@v4
        with:
          name: nevera-stress-test
          path: stress-test-result.json
