name: NEVERA Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Run large backtest
        run: node scripts/backtest.js > backtest-result.json
      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: nevera-backtest
          path: backtest-result.json

      - name: Run adversarial stress test
        run: node scripts/stress-test.js > stress-test-result.json
      - name: Upload stress test result
        uses: actions/upload-artifact@v4
        with:
          name: nevera-stress-test
          path: stress-test-result.json
